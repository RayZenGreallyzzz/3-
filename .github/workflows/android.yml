name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test arm pose and animation baking
        run: |
          npm run test:pose > /tmp/rig-weapon-tests.log 2>&1
          status=$?
          cat /tmp/rig-weapon-tests.log
          exit $status
      - name: Report failed tests to pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f /tmp/rig-weapon-tests.log ]; then
            { echo 'Automation CI failed. Relevant test errors:'; grep -B 2 -A 18 -E '^not ok|Error:|error:|# fail ' /tmp/rig-weapon-tests.log | tail -n 130 || true; } > /tmp/rig-pr-diagnostics.txt
          else
            echo 'CI failed before test log creation (dependencies/setup).' > /tmp/rig-pr-diagnostics.txt
          fi
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/rig-pr-diagnostics.txt)"
      - name: Compile 3D editor
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Apply custom Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp branding/android/panda-icon.png android/app/src/main/res/drawable-nodpi/panda_icon.png
          cp branding/android/rig_launcher_foreground.xml android/app/src/main/res/drawable/rig_launcher_foreground.xml
          cp branding/android/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp branding/android/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Add native Android file-save picker
        run: |
          mkdir -p android/app/src/main/java/com/rayzeng/rigweaponstudio
          cp branding/android/native/MainActivity.java android/app/src/main/java/com/rayzeng/rigweaponstudio/MainActivity.java
          cp branding/android/native/NativeFileSaverPlugin.java android/app/src/main/java/com/rayzeng/rigweaponstudio/NativeFileSaverPlugin.java
      - name: Synchronize web assets
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Rig-Weapon-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
